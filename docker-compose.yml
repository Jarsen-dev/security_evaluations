# ===========================================================================
# Sistema de Evaluación de Conocimientos — stack de PRODUCCIÓN
#
#   docker-compose up -d --build
#
# El servidor hospeda otros proyectos: este stack declara su propio `name`,
# su propia red y su propio volumen para no colisionar con ellos.
# El único puerto expuesto al host es el de Nginx.
# ===========================================================================

name: evaluaciones

# Rotación de logs. Sin esto, el driver json-file de Docker crece sin tope:
# con ~500 empleados contestando y Nginx registrando cada petición, el disco
# del servidor se llena solo. 10 MB x 5 archivos por servicio.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    container_name: evaluaciones_db
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Evita que un cambio de locale del host altere el ordenamiento de texto.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - evaluaciones_pgdata:/var/lib/postgresql/data
    networks:
      - evaluaciones_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # En producción el puerto de Postgres NO se publica al host.
    # Ver docker-compose.dev.yml si necesitas conectarte con psql o pgAdmin.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evaluaciones_backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Apaga /api/docs y /api/openapi.json (ver docs_publicas en config.py).
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      UMBRAL_APROBACION: ${UMBRAL_APROBACION}
      WIFI_SSID: ${WIFI_SSID:-}
      WIFI_PASSWORD: ${WIFI_PASSWORD:-}
      WIFI_SEGURIDAD: ${WIFI_SEGURIDAD:-WPA}
      WIFI_OCULTA: ${WIFI_OCULTA:-false}
      RATE_LIMIT_PETICIONES: ${RATE_LIMIT_PETICIONES:-30}
      RATE_LIMIT_VENTANA_SEGUNDOS: ${RATE_LIMIT_VENTANA_SEGUNDOS:-60}
      RATE_LIMIT_LOGIN_INTENTOS: ${RATE_LIMIT_LOGIN_INTENTOS:-5}
      RATE_LIMIT_LOGIN_VENTANA_SEGUNDOS: ${RATE_LIMIT_LOGIN_VENTANA_SEGUNDOS:-300}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      # Zona de la planta: la bitácora se guarda en UTC pero se filtra por la
      # hora del reloj de la nave.
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Monterrey}
      # Accesos de la pestaña de Mantenimiento. Sin prefijo NEXT_PUBLIC_:
      # la contraseña la sirve la API con sesión de superadministrador, no
      # se incrusta en el bundle que descarga cualquiera.
      PGADMIN_URL_LOCAL: ${PGADMIN_URL_LOCAL:-}
      PGADMIN_URL_PRODUCCION: ${PGADMIN_URL_PRODUCCION:-}
      PGADMIN_EMAIL: ${PGADMIN_EMAIL:-}
      PGADMIN_PASSWORD: ${PGADMIN_PASSWORD:-}
      # Correo saliente y reporte automático de rondines. Estaban en
      # config.py pero no se pasaban aquí, así que corrían con los valores
      # por defecto y el envío quedaba apagado sin que nada lo dijera.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: "${SMTP_PUERTO:-465}"
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_DESDE: ${SMTP_DESDE:-}
      SMTP_SSL: ${SMTP_SSL:-true}
      RONDINES_REPORTE_AUTOMATICO: ${RONDINES_REPORTE_AUTOMATICO:-false}
      RONDINES_DESTINATARIOS: ${RONDINES_DESTINATARIOS:-}
      # Recepciones por foto. El host de Ollama vive fuera de este stack, en
      # la LAN; el contenedor lo alcanza por la red del puente. Umbral y
      # tiempos se dejan tuneables para recalibrar sin reconstruir la imagen.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://192.168.1.56:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.2:latest}
      OCR_UMBRAL_SIMILITUD: "${OCR_UMBRAL_SIMILITUD:-0.20}"
      OCR_TIMEOUT_PS: "${OCR_TIMEOUT_PS:-5}"
      OCR_TIMEOUT_FRIO: "${OCR_TIMEOUT_FRIO:-90}"
      OCR_TIMEOUT_CALIENTE: "${OCR_TIMEOUT_CALIENTE:-30}"
      # Techo duro de extremo a extremo. DEBE quedar por debajo del
      # proxy_read_timeout de Nginx (120 s) o el navegador recibe un 500
      # opaco en vez del 200 con ocr_ok:false que abre la captura manual.
      OCR_PRESUPUESTO_TOTAL: "${OCR_PRESUPUESTO_TOTAL:-100}"
      RECEPCIONES_MAX_BYTES_FOTO: "${RECEPCIONES_MAX_BYTES_FOTO:-15728640}"
      RECEPCIONES_MINUTOS_SESION_QR: "${RECEPCIONES_MINUTOS_SESION_QR:-10}"
      # Las comillas son obligatorias: docker-compose v2.24 serializa los
      # enteros de YAML sin comillas como `%!s(int=4)` al fusionar varios
      # archivos, y uvicorn lee UVICORN_WORKERS automáticamente (prefijo
      # UVICORN_ de su CLI), así que el valor corrupto le impide arrancar.
      UVICORN_WORKERS: "4"
    networks:
      - evaluaciones_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next.js incrusta las variables NEXT_PUBLIC_* en el bundle durante el
        # build, no en runtime: por eso viaja como build arg y no solo como env.
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    container_name: evaluaciones_frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      # URL interna que usan los Server Components para hablar con la API
      # sin salir de la red de Docker.
      API_INTERNAL_URL: http://backend:8000
    networks:
      - evaluaciones_net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: evaluaciones_pgadmin
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Estas credenciales son las que la pestaña de Mantenimiento copia
      # al portapapeles.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # SERVER_MODE se queda en su valor por omisión (True) A PROPÓSITO: el
      # modo escritorio entra sin pedir nada, y como este puerto sí se
      # publica en la LAN, cualquiera de la planta tendría la base entera
      # abierta con solo teclear la IP.
      #
      # Entre comillas a propósito (ver la nota de UVICORN_WORKERS arriba).
      PGADMIN_CONFIG_LOGIN_BANNER: "\"Sistema ESH — acceso restringido\""
    volumes:
      - evaluaciones_pgadmin:/var/lib/pgadmin
      # Precarga la conexión a `db` para no teclear el host cada vez.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      # A DIFERENCIA del resto del stack, este puerto SÍ se publica en
      # producción: es la única forma de que el botón de Mantenimiento
      # llegue a pgAdmin. Queda alcanzable solo desde la LAN de la planta —
      # el túnel de Cloudflare apunta a nginx:80 y no lo publica, y el
      # puerto NO debe abrirse en ufw hacia fuera (ver SEGURIDAD.md).
      - "${PGADMIN_PORT:-5150}:80"
    networks:
      - evaluaciones_net

  nginx:
    image: nginx:1.27-alpine
    container_name: evaluaciones_nginx
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - evaluaciones_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: evaluaciones_cloudflared
    restart: unless-stopped
    command: tunnel run
    depends_on:
      - nginx
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - evaluaciones_net
    # No expone puertos al host: la conexión hacia Cloudflare la inicia
    # este contenedor, no al revés. Llega a nginx por nombre de servicio
    # dentro de evaluaciones_net (http://nginx:80).

volumes:
  evaluaciones_pgdata:
    name: evaluaciones_pgdata
  evaluaciones_pgadmin:
    name: evaluaciones_pgadmin

networks:
  evaluaciones_net:
    name: evaluaciones_net
    driver: bridge