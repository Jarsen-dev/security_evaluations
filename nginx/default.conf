# ===========================================================================
# Nginx: único punto de entrada del sistema.
#   /api/*  -> backend FastAPI
#   resto   -> frontend Next.js
# ===========================================================================

# IP real del cliente.
#
# Cloudflare Tunnel entrega TODO el tráfico desde una sola conexión, así que
# `$remote_addr` sería la misma IP para los cientos de celulares que entran
# por el dominio público, y el límite de tasa los bloquearía entre ellos.
# Cloudflare pone la IP verdadera en `CF-Connecting-IP`; cuando esa cabecera
# viene, se usa esa.
#
# Un cliente de la LAN podría falsificarla, pero lo único que lograría es
# evadir su propio límite de peticiones, que es justo lo que consigue
# cambiando de dispositivo. No protege ningún dato.
map $http_cf_connecting_ip $ip_cliente {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

upstream backend_api {
    server backend:8000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Subida de archivos Excel para importar preguntas (Fase 5).
    client_max_body_size 10M;

    # No revelar la versión de Nginx.
    server_tokens off;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # HSTS: ahora que todo el acceso entra por el dominio, el navegador debe
    # negarse a volver a hablar en HTTP con él aunque alguien reparta una liga
    # `http://`. Nginx responde en texto plano detrás del túnel, pero eso no
    # estorba: el navegador ignora esta cabecera cuando la recibe por HTTP, así
    # que entrar directo por la IP de la LAN sigue funcionando igual.
    #
    # Un año, sin `preload` ni `includeSubDomains`: el dominio hospeda otras
    # cosas y esas dos opciones son difíciles de revertir.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Nada de este sistema tiene por qué mostrarse dentro de un iframe ajeno
    # ni necesita cámara, micrófono o ubicación.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # X-Real-IP alimenta el rate limiting por IP y la columna
        # intentos.ip_origen: sin esto el backend vería siempre la IP de Nginx.
        proxy_set_header X-Real-IP         $ip_cliente;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 120s: las exportaciones a Excel y PowerPoint (Fase 7) pueden tardar
        # más que el default de 60s con muchos intentos.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Las descargas se envían conforme se generan, sin bufferear el
        # archivo completo en disco.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $ip_cliente;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket del hot reload de Next.js en desarrollo.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
