# ===========================================================================
# Nginx: único punto de entrada del sistema.
#   /api/*  -> backend FastAPI
#   resto   -> frontend Next.js
# ===========================================================================

upstream backend_api {
    server backend:8000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Subida de archivos Excel para importar preguntas (Fase 5).
    client_max_body_size 10M;

    # No revelar la versión de Nginx.
    server_tokens off;

    # Cabeceras de seguridad básicas. Sin HSTS: la LAN industrial opera
    # sobre HTTP y forzar HTTPS dejaría el sistema inaccesible.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # X-Real-IP alimenta el rate limiting por IP y la columna
        # intentos.ip_origen: sin esto el backend vería siempre la IP de Nginx.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 120s: las exportaciones a Excel y PowerPoint (Fase 7) pueden tardar
        # más que el default de 60s con muchos intentos.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Las descargas se envían conforme se generan, sin bufferear el
        # archivo completo en disco.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket del hot reload de Next.js en desarrollo.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
