# Configuración de Alembic.
# La URL de conexión NO se escribe aquí: alembic/env.py la toma de la
# configuración de la aplicación (variable de entorno DATABASE_URL) para que
# exista un solo lugar donde definirla.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Nombre de archivo de las revisiones: fecha + slug, para que el orden
# cronológico sea evidente al listar el directorio.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
